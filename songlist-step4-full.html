const genreContainer = document.getElementById("genreButtons");
let activeGenre = "All";

function renderGenreButtons() {
  genreContainer.innerHTML = "";

  genres.forEach((genre) => {
    const btn = document.createElement("button");
    btn.textContent = genre;
    btn.type = "button";
    btn.style.margin = "4px";
    btn.style.padding = "8px 12px";
    btn.style.borderRadius = "999px";
    btn.style.border = "1px solid " + (activeGenre === genre ? "#1db954" : "#444");
    btn.style.background = activeGenre === genre ? "#1db954" : "#1d1d1d";
    btn.style.color = "#fff";
    btn.style.cursor = "pointer";
    btn.style.fontSize = "13px";
    btn.style.fontWeight = "600";

    btn.addEventListener("click", () => {
      activeGenre = genre;
      renderGenreButtons();
      renderSongs();
    });

    genreContainer.appendChild(btn);
  });
}

function renderSongs() {
  const search = document.getElementById("songSearch").value.trim().toLowerCase();
  const list = document.getElementById("songList");

  const filtered = songs.filter((song) => {
    const matchesGenre = activeGenre === "All" || song.genres.includes(activeGenre);
    const haystack = `${song.title} ${song.artist} ${song.genres.join(" ")}`.toLowerCase();
    const matchesSearch = !search || haystack.includes(search);
    return matchesGenre && matchesSearch;
  });

  filtered.sort((a, b) => {
    if (a.title.toLowerCase() < b.title.toLowerCase()) return -1;
    if (a.title.toLowerCase() > b.title.toLowerCase()) return 1;
    return a.artist.localeCompare(b.artist);
  });

  list.innerHTML = `
    <div style="margin-bottom:12px; color:#bbb; font-size:13px;">
      ${filtered.length} song${filtered.length === 1 ? "" : "s"} shown
    </div>
  `;

  if (!filtered.length) {
    list.innerHTML += `<div style="color:#bbb;">No songs matched your search.</div>`;
    return;
  }

  filtered.forEach((song) => {
    const row = document.createElement("div");
    row.style.padding = "10px 0";
    row.style.borderBottom = "1px solid #2a2a2a";

    const genresHtml = song.genres
      .map((genre) => `<span style="display:inline-block; margin:4px 6px 0 0; padding:3px 8px; font-size:11px; border-radius:999px; background:#222; color:#bfe9c9;">${genre}</span>`)
      .join("");

    row.innerHTML = `
      <div style="font-weight:700; color:#fff;">${song.title}</div>
      <div style="color:#cfcfcf;">${song.artist}</div>
      <div>${genresHtml}</div>
    `;

    list.appendChild(row);
  });
}

document.getElementById("songSearch").addEventListener("input", renderSongs);

renderGenreButtons();
renderSongs();
</script>
